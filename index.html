<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرقامي PRO - رسائل مباشرة وحصرية</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #0044cc;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .container {
            padding: 15px;
            max-width: 600px;
            margin: auto;
        }
        .ad-box {
            border: 2px dashed #f0ad4e;
            background: #fffbe6;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .number-card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .number-info {
            font-size: 16px;
            font-weight: bold;
            direction: ltr;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .btn-copy {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-view {
            background-color: #6f42c1;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 30px;
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        ⚡ أرقامي PRO - رسائل مباشرة وحصرية
    </header>

    <div class="container">
        <div class="ad-box">
            📢 إعلان - مساحة إعلانية
        </div>

        <p style="text-align: center; font-weight: bold;">أحدث الأرقام المجانية لاستقبال رسائل الواتساب والتحقق</p>

        <!-- مكان عرض الأرقام -->
        <div id="numbers-container">
            <div class="loading">جاري تحميل الأرقام...</div>
        </div>
    </div>

    <script>
        const fallbackNumbers = [
            { country: "اليمن - أرقام متاحة للاستلام الفوري", flag: "🇾🇪", number: "+967 771 1000", link: "#" },
            { country: "السعودية - أرقام متاحة للاستلام الفوري", flag: "🇸🇦", number: "+966 55 1000000", link: "#" },
            { country: "مصر - أرقام متاحة للاستلام الفوري", flag: "🇪🇬", number: "+20 10 10000000", link: "#" }
        ];

        function renderNumbers(data) {
            const container = document.getElementById('numbers-container');
            container.innerHTML = "";

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.innerHTML = `
                    <div>
                        <span>${item.flag || '🌍'}</span> <span>${item.country || 'رقم جديد'}</span>
                        <div class="number-info">${item.number}</div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-copy" onclick="copyNumber('${item.number}')">نسخ الرقم</button>
                        <a href="${item.link || '#'}" class="btn-view" target="_blank">عرض الرسائل هنا</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyNumber(num) {
            navigator.clipboard.writeText(num);
            alert("تم نسخ الرقم: " + num);
        }

        async function loadNumbers() {
            try {
                // سحب البيانات تلقائياً من ملف numbers.json الموجود في مستودعك
                let response = await fetch('numbers.json');
                if (!response.ok) throw new Error("الملف غير متوفر");
                let data = await response.json();
                
                if (data && data.length > 0) {
                    renderNumbers(data);
                } else {
                    renderNumbers(fallbackNumbers);
                }
            } catch (error) {
                // في حال حدث أي خطأ في قراءة الملف، يتم عرض القائمة الاحتياتية فوراً
                renderNumbers(fallbackNumbers);
            }
        }

        loadNumbers();
    </script>
</body>
</html>
