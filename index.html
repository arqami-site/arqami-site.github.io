<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرقامي | أرقام وهمية مجانية لاستقبال الرسائل SMS</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9}
.top{background:#0f172a;color:#fff;text-align:center;padding:15px 10px}
.top b{color:#22c55e;font-size:22px}
.top p{margin:5px 0;color:#cbd5e1;font-size:14px}
.btns{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap;background:#fff}
.btns button{border:none;padding:10px 18px;border-radius:25px;cursor:pointer;font-size:14px;font-weight:bold}
.b1{background:#22c55e;color:#fff}
.b2{background:#0f172a;color:#fff}
.b3{background:#f59e0b;color:#fff}
.btns button.active{outline:3px solid #22c55e}
iframe{width:100%;height:calc(100vh - 150px);border:none;background:#fff}
.footer{background:#0f172a;color:#cbd5e1;text-align:center;padding:15px;font-size:13px}
</style>
</head>
<body>
<div class="top"><b>أرقامي</b><p>أرقام وهمية مجانية لاستقبال رسائل SMS للتحقق والتفعيل</p></div>
<div class="btns">
<button class="b1 active" onclick="show('https://receive-sms.io/',this)">مصدر 1 - أمريكا</button>
<button class="b2" onclick="show('https://receive-sms-free.cc/regions/',this)">مصدر 2 - 30+ دولة</button>
<button class="b3" onclick="show('https://getfreesmsnumber.com/',this)">مصدر 3</button>
</div>
<iframe id="frame" src="https://receive-sms.io/"></iframe>
<div class="footer">© 2026 أرقامي - جميع الحقوق محفوظة</div>
<script>
function show(url,btn){
document.getElementById('frame').src=url;
document.querySelectorAll('.btns button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}
</script>
</body>
</html>
