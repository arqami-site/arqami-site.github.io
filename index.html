<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرقام مجانية - أرقام SMS مجانية</title>
<meta name="description" content="أرقام مجانية لاستقبال رسائل SMS للتحقق">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
body{background:#f8fafc;color:#0f172a;padding-bottom:80px}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:10;flex-wrap:wrap}
.logo{font-weight:900;font-size:18px}
.pill{border:1px solid #e2e8f0;border-radius:999px;padding:6px 12px;font-size:13px;background:#fff;cursor:pointer}
.earn{background:#e7f8e8;color:#15803d;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.avatar{width:38px;height:38px;border-radius:50%;background:#0ea5e9;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;margin-inline-start:auto}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.search{width:100%;padding:13px 16px;border:1px solid #e2e8f0;border-radius:14px;font-size:16px;outline:none;background:#fff}
.hint{margin:12px 4px;color:#64748b;font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
.country{font-weight:900;font-size:17px}
.flag{font-size:26px}
.number{font-size:22px;font-weight:900;letter-spacing:1px;margin:14px 0 6px;direction:ltr;text-align:left;color:#0f172a;min-height:30px}
.meta{color:#64748b;font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.badge{background:#f1f5f9;border-radius:999px;padding:4px 9px;font-size:12px}
.copybtn{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:#0ea5e9;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.copybtn.copied{background:#22c55e}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:12px 22px;border-radius:999px;font-weight:800;z-index:9999}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<header>
<button class="pill" onclick="toggleLang()">EN</button>
<div class="earn">الأرباح: 0.00$</div>
<div class="logo">أرقام مجانية - الواجهة الحقيقية المخفية</div>
<div class="avatar">R</div>
</header>
<div class="wrap">
<input class="search" id="search" placeholder="ابحث عن دولة... بلجيكا، كندا، أمريكا..." oninput="render()">
<p class="hint">اضغط على أي بطاقة أو زر نسخ لنسخ الرقم. الرقم ما رح ينمسح بعد النسخ.</p>
<div class="grid" id="grid"></div>
<p class="footer">arqami-site.github.io - أرقام مجانية لاستقبال SMS</p>
</div>
<script>
const DATA=[
{country:"بلجيكا",flag:"🇧🇪",number:"+32 470 12 34 56",sms:"12 رسالة اليوم",online:"متصل الآن"},
{country:"كندا",flag:"🇨🇦",number:"+1 438 555 0182",sms:"8 رسائل اليوم",online:"متصل الآن"},
{country:"أمريكا",flag:"🇺🇸",number:"+1 202 555 0147",sms:"21 رسالة اليوم",online:"متصل الآن"},
{country:"بريطانيا",flag:"🇬🇧",number:"+44 20 7946 0958",sms:"15 رسالة اليوم",online:"متصل الآن"},
{country:"فرنسا",flag:"🇫🇷",number:"+33 6 12 34 56 78",sms:"9 رسائل اليوم",online:"متصل الآن"},
{country:"ألمانيا",flag:"🇩🇪",number:"+49 170 1234567",sms:"7 رسائل اليوم",online:"متصل الآن"},
{country:"هولندا",flag:"🇳🇱",number:"+31 6 12345678",sms:"6 رسائل اليوم",online:"متصل الآن"},
{country:"السويد",flag:"🇸🇪",number:"+46 70 123 45 67",sms:"5 رسائل اليوم",online:"متصل الآن"},
{country:"إسبانيا",flag:"🇪🇸",number:"+34 612 34 56 78",sms:"4 رسائل اليوم",online:"متصل الآن"},
{country:"إيطاليا",flag:"🇮🇹",number:"+39 333 1234567",sms:"11 رسائل اليوم",online:"متصل الآن"}
];
function render(){
const q=(document.getElementById('search').value||'').trim();
const grid=document.getElementById('grid');
const list=DATA.filter(d=>!q||d.country.includes(q)||d.number.includes(q));
grid.innerHTML=list.map(d=>`
<div class="card" onclick="copyNumber('${d.number}',this)">
<div class="top"><div class="country">${d.country}</div><div class="flag">${d.flag}</div></div>
<div class="number">${d.number}</div>
<div class="meta"><span class="badge">📩 ${d.sms}</span><span class="badge">🟢 ${d.online}</span></div>
<button class="copybtn" onclick="event.stopPropagation();copyNumber('${d.number}',this.closest('.card'))">نسخ الرقم 📋</button>
</div>`).join('')||'<p style="text-align:center;color:#64748b;padding:20px">لا توجد نتائج</p>';
}
function showToast(msg){
const old=document.querySelector('.toast');if(old)old.remove();
const t=document.createElement('div');t.className='toast';t.textContent=msg;
document.body.appendChild(t);setTimeout(()=>t.remove(),1800);
}
async function copyNumber(number,card){
const clean=number.trim();
try{await navigator.clipboard.writeText(clean);}catch(e){
const ta=document.createElement('textarea');ta.value=clean;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}ta.remove();
}
showToast('تم النسخ ✅ '+clean);
if(card){const btn=card.querySelector('.copybtn');
if(btn){const oldText=btn.textContent;btn.textContent='تم النسخ ✅';btn.classList.add('copied');
setTimeout(()=>{btn.textContent=oldText;btn.classList.remove('copied');},1500);}}
}
function toggleLang(){alert('النسخة الإنجليزية قريباً');}
if(location.hash&&location.hash.includes('native-copy')){history.replaceState(null,'',location.pathname);}
render();
</script>
</body>
</html>
