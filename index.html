    </div>

    <script>
        // تم حذف الأرقام الوهمية +967 771 1000 و +966 55 1000000 نهائياً
        const realNumbers = [
            { country: "الولايات المتحدة - أرقام متاحة للاستلام الفوري", flag: "🇺🇸", number: "+1 407-544-9125", link: "#" },
            { country: "الولايات المتحدة - أرقام متاحة للاستلام الفوري", flag: "🇺🇸", number: "+1 413-278-4571", link: "#" },
            { country: "هولندا - أرقام متاحة للاستلام الفوري", flag: "🇳🇱", number: "+31 97058029582", link: "#" },
            { country: "فنلندا - أرقام متاحة للاستلام الفوري", flag: "🇫🇮", number: "+358 4573989692", link: "#" },
            { country: "الولايات المتحدة - أرقام متاحة للاستلام الفوري", flag: "🇺🇸", number: "+1 224-401-0289", link: "#" }
        ];

        function renderNumbers(data) {
            const container = document.getElementById('numbers-container');
            container.innerHTML = "";
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.innerHTML = `
                    <div>
                        <span>${item.flag || '🌍'}</span> <span>${item.country || 'رقم جديد'}</span>
                        <div class="number-info">${item.number}</div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-copy" onclick="copyNumber('${item.number}')">نسخ الرقم</button>
                        <a href="${item.link || '#'}" class="btn-view" target="_blank">عرض الرسائل هنا</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyNumber(num) {
            navigator.clipboard.writeText(num);
            alert("تم نسخ الرقم: " + num);
        }

        async function loadNumbers() {
            try {
                let response = await fetch('numbers.json');
                if (!response.ok) throw new Error("الملف غير متوفر");
                let data = await response.json();
                // الإصلاح: numbers.json شكله { numbers: [...] } مو مصفوفة مباشرة
                let list = data.numbers || data;
                if (list && list.length > 0) {
                    renderNumbers(list);
                } else {
                    renderNumbers(realNumbers);
                }
            } catch (error) {
                // اذا فشل الجلب، اعرض الأرقام الحقيقية المدمجة، مو الوهمية
                renderNumbers(realNumbers);
            }
        }

        loadNumbers();
    </script>
</body>
</html>
