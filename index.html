<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرقامي | كل دولة لحالها</title>
<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
.top{background:#0f172a;color:#fff;text-align:center;padding:18px 10px;position:sticky;top:0;z-index:20}
.top b{color:#22c55e;font-size:26px}
.top p{color:#cbd5e1;font-size:12px;margin:5px 0 0}
.filter{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap;background:#fff}
.filter button{border:none;padding:9px 16px;border-radius:20px;font-weight:bold;background:#e2e8f0;cursor:pointer}
.filter button.active{background:#22c55e;color:#fff}
.wrap{padding:15px;max-width:900px;margin:auto}
.countryBox{background:#fff;border-radius:18px;margin-bottom:20px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.countryHead{background:#0f172a;color:#fff;padding:14px 15px;display:flex;justify-content:space-between;align-items:center}
.count{background:#22c55e;color:#fff;padding:4px 12px;border-radius:20px;font-size:12px}
.numRow{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:10px}
.num{font-size:18px;font-weight:bold;direction:ltr}
.badge{font-size:12px;padding:3px 8px;border-radius:10px;font-weight:bold}
.wa2{background:#25D366;color:#fff}
.wa{background:#dcfce7;color:#166534}
.btns{display:flex;gap:7px}
.btns button{padding:8px 14px;border-radius:20px;border:none;font-weight:bold;cursor:pointer;font-size:12px}
.copy{background:#0f172a;color:#fff}
.open{background:#22c55e;color:#fff}
#viewer{display:none;background:#fff;margin:0 15px 15px;border-radius:15px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1)}
#viewerHead{background:#0f172a;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
#viewerHead button{background:#ef4444;color:#fff;border:none;padding:7px 12px;border-radius:15px;cursor:pointer}
#viewer iframe{width:100%;height:650px;border:none;background:#fff}
</style>
</head>
<body>
<div class="top"><b>أرقامي</b><p>كل دولة بخانة لحالها - الرسائل تفتح هون بنفس الموقع</p></div>
<div class="filter">
<button class="active" onclick="show('all',this)">كل الدول</button>
<button onclick="show('arab',this)">🌍 الدول العربية</button>
<button onclick="show('usa',this)">🇺🇸 أمريكا</button>
<button onclick="show('europe',this)">🇪🇺 أوروبا</button>
<button onclick="show('wa',this)">💚 يقبل واتساب</button>
</div>
<div id="viewer">
<div id="viewerHead"><span id="viewerTitle">📩 رسائل الرقم</span><button onclick="closeViewer()">✕ إغلاق</button></div>
<div style="background:#fef9c3;padding:10px;font-size:12px;text-align:center">✅ انت لسا بموقع أرقامي - الرسائل حقيقية وتتحدث لحظة بلحظة</div>
<iframe id="msgFrame" src=""></iframe>
<div style="text-align:center;padding:10px"><a id="openExternal" href="#" target="_blank" style="color:#2563eb;font-size:13px">إذا ما فتحت هون، اضغط هون</a></div>
</div>
<div class="wrap" id="list"></div>
<script>
const countries=[
{ name:"أمريكا", flag:"🇺🇸", cat:"usa", nums:[
 {num:"+12039166319", wa:true, link:"https://receive-sms.io/usa/"},
 {num:"+12017878454", wa:true, link:"https://receive-sms.io/usa/"},
 {num:"+13125551234", wa:true, link:"https://receive-sms.io/usa/"},
]},
{ name:"بريطانيا", flag:"🇬🇧", cat:"europe", nums:[
 {num:"+447537150994", wa:true, link:"https://receive-sms-free.cc/country/united-kingdom/"},
 {num:"+447400123456", wa:true, link:"https://receive-sms-free.cc/country/united-kingdom/"},
]},
{ name:"كندا", flag:"🇨🇦", cat:"usa", nums:[
 {num:"+12893340783", wa:true, link:"https://receive-sms-free.cc/country/canada/"},
]},
{ name:"فرنسا", flag:"🇫🇷", cat:"europe", nums:[
 {num:"+33611112222", wa:false, link:"https://receive-sms-free.cc/country/france/"},
]},
{ name:"ألمانيا", flag:"🇩🇪", cat:"europe", nums:[
 {num:"+491511112222", wa:false, link:"https://receive-sms-free.cc/country/germany/"},
]},
{ name:"السعودية", flag:"🇸🇦", cat:"arab", nums:[
 {num:"اضغط لعرض المتوفر", wa:false, link:"https://receive-sms-free.cc/regions/"},
]},
{ name:"مصر", flag:"🇪🇬", cat:"arab", nums:[
 {num:"اضغط لعرض المتوفر", wa:false, link:"https://receive-sms-free.cc/regions/"},
]},
{ name:"الإمارات", flag:"🇦🇪", cat:"arab", nums:[
 {num:"اضغط لعرض المتوفر", wa:false, link:"https://receive-sms-free.cc/regions/"},
]},
{ name:"المغرب", flag:"🇲🇦", cat:"arab", nums:[
 {num:"اضغط لعرض المتوفر", wa:false, link:"https://receive-sms-free.cc/regions/"},
]},
{ name:"العراق", flag:"🇮🇶", cat:"arab", nums:[
 {num:"اضغط لعرض المتوفر", wa:false, link:"https://receive-sms-free.cc/regions/"},
]},
];
function render(filter){
let html="";
countries.forEach(c=>{
if(filter!=="all" && filter!=="wa" && c.cat!==filter) return;
let nums = filter==="wa" ? c.nums.filter(n=>n.wa) : c.nums;
if(nums.length===0) return;
html+=`<div class="countryBox"><div class="countryHead"><b>${c.flag} ${c.name}</b><span class="count">${nums.length} أرقام</span></div>`;
nums.forEach(n=>{
let badge = n.wa ? '<span class="badge wa2">💚 يقبل واتساب</span>' : '<span class="badge wa">📩 SMS فقط</span>';
html+=`<div class="numRow"><div><div class="num">${n.num}</div>${badge}</div><div class="btns"><button class="copy" onclick="copyNum('${n.num}')">📋 نسخ</button><button class="open" onclick="openMsg('${n.link}','${c.name} ${n.num}')">عرض الرسائل هون 👇</button></div></div>`;
});
html+=`</div>`;
});
document.getElementById("list").innerHTML=html;
}
function show(f,b){document.querySelectorAll(".filter button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(f);}
function copyNum(n){navigator.clipboard.writeText(n);alert("تم نسخ الرقم: "+n+" ✅");}
function openMsg(link,title){
document.getElementById("viewer").style.display="block";
document.getElementById("viewerTitle").innerText="📩 رسائل: "+title;
document.getElementById("msgFrame").src=link;
document.getElementById("openExternal").href=link;
document.getElementById("viewer").scrollIntoView({behavior:"smooth"});
}
function closeViewer(){document.getElementById("viewer").style.display="none";document.getElementById("msgFrame").src="";}
render("all");
</script>
</body>
</html>
