<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0}
header{background:#020617;padding:25px 15px;text-align:center;border-bottom:3px solid #22c55e}
header h1{margin:0;font-size:28px}
header p{color:#94a3b8}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:15px}
.tab{background:#1e293b;color:white;border:none;padding:10px 16px;border-radius:20px;cursor:pointer}
.tab.active{background:#22c55e;color:#000;font-weight:bold}
.search{max-width:500px;margin:0 auto 15px auto;padding:0 15px}
.search input{width:100%;padding:12px;border-radius:10px;border:none;outline:none;font-size:16px}
.section{max-width:1100px;margin:20px auto 5px auto;padding:0 15px;font-size:20px;font-weight:bold}
.grid{max-width:1100px;margin:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}
.card{background:#1e293b;border:1px solid #334155;border-radius:15px;padding:16px;text-align:center}
.country{font-size:18px;font-weight:bold}
.flag{font-size:30px}
.number{font-size:19px;font-weight:bold;background:#000;padding:10px;border-radius:10px;margin:10px 0;direction:ltr}
.badge{display:inline-block;background:#14532d;padding:4px 10px;border-radius:20px;font-size:12px;margin:2px}
.btn{display:block;padding:12px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:8px;border:none;cursor:pointer;width:100%;font-size:15px}
.copy{background:white;color:black}
.inbox{background:#22c55e;color:white}
.warn{max-width:1100px;margin:15px auto;padding:12px;background:#fef3c7;color:#333;border-radius:10px;font-size:13px;line-height:1.7}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:12px 20px;border-radius:20px;font-weight:bold;z-index:999}
</style>

function setF(f,el){FILTER=f;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render();}
function card(d){return `<div class="card"><div class="flag">${d.flag}</div><div class="country">${d.country}</div><div class="number">${d.number}</div><div><span class="badge">🟢 متاح</span> <span class="badge">📩 صندوق حقيقي</span></div><button class="btn copy" onclick="copyNum('${d.number}',this)">📋 نسخ الرقم</button><button class="btn inbox" onclick="openInbox('${d.country}','${d.flag}','${d.number}')">📥 فتح صندوق الوارد الحقيقي</button></div>`}
function render(){
const q=(document.getElementById('search').value||'').trim();
let list=DATA.filter(d=>FILTER==='all'||FILTER===d.code||FILTER===d.type);
if(q) list=list.filter(d=>d.country.includes(q)||d.number.includes(q));
let html='';
if(FILTER==='yemen'){html=`<div class="section">🇾🇪 اليمن (${list.length})</div><div class="grid">${list.map(card).join('')}</div>`;}
else{
if(FILTER==='all'||FILTER==='arab'){const a=list.filter(d=>d.type==='arab');if(a.length) html+=`<div class="section">🌍 الدول العربية (${a.length})</div><div class="grid">${a.map(card).join('')}</div>`;}
if(FILTER==='all'||FILTER==='world'){const w=list.filter(d=>d.type==='world');if(w.length) html+=`<div class="section">🌐 دول العالم (${w.length})</div><div class="grid">${w.map(card).join('')}</div>`;}
}
if(!html) html='<p style="text-align:center;padding:30px;color:#94a3b8">لا توجد نتائج</p>';
document.getElementById('content').innerHTML=html;
}
function toast(m){const o=document.querySelector('.toast');if(o)o.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}
async function copyNum(n,btn){try{await navigator.clipboard.writeText(n)}catch(e){const ta=document.createElement('textarea');ta.value=n;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}toast('تم النسخ ✅ '+n);const old=btn.textContent;btn.textContent='تم النسخ ✅';setTimeout(()=>btn.textContent=old,1500);}
function openInbox(c,f,n){
  const item = DATA.find(d => d.number === n);
  if(item && item.inbox){
    window.open(item.inbox, '_blank');
    toast('جاري فتح الصندوق الحقيقي... 📩');
    return;
  }
}
