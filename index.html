<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرقامي | كل دولة لحالها</title>
<style>
body{margin:0;font-family:Arial;background:#f1f5f9}
.top{background:#0f172a;color:#fff;text-align:center;padding:20px 10px}
.top b{color:#22c55e;font-size:28px}
.filter{display:flex;gap:8px;justify-content:center;padding:12px;flex-wrap:wrap;background:#fff}
.filter button{border:none;padding:9px 16px;border-radius:20px;font-weight:bold;background:#e2e8f0}
.filter button.active{background:#22c55e;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;padding:15px}
.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 4px 12px rgba(0,0,0,.07)}
.num{font-size:19px;font-weight:bold;margin:10px 0;direction:ltr;text-align:left}
.btns{display:flex;gap:8px}
.btns button,.btns a{flex:1;text-align:center;padding:10px;border-radius:20px;border:none;font-weight:bold;text-decoration:none;font-size:13px}
.copy{background:#0f172a;color:#fff}
.open{background:#22c55e;color:#fff}
</style>
</head>
<body>
<div class="top"><b>أرقامي - النسخة الجديدة V2</b><p>كل دولة بخانة لحالها - زر نسخ - يقبل واتساب - رسائل حقيقية</p></div>
<div class="filter">
<button class="active" onclick="show('all',this)">كل الدول</button>
<button onclick="show('arab',this)">🌍 الدول العربية</button>
<button onclick="show('usa',this)">🇺🇸 أمريكا</button>
<button onclick="show('europe',this)">🇪🇺 أوروبا</button>
<button onclick="show('wa',this)">💚 يقبل واتساب</button>
</div>
<div class="grid" id="list"></div>
<script>
const data=[
{country:"أمريكا",flag:"🇺🇸",cat:"usa wa",num:"+12039166319",link:"https://receive-sms.io/usa/"},
{country:"أمريكا 2",flag:"🇺🇸",cat:"usa wa",num:"+12017878454",link:"https://receive-sms.io/usa/"},
{country:"بريطانيا",flag:"🇬🇧",cat:"europe wa",num:"+447400123456",link:"https://receive-sms-free.cc/country/united-kingdom/"},
{country:"فرنسا",flag:"🇫🇷",cat:"europe",num:"+33612345678",link:"https://receive-sms-free.cc/country/france/"},
{country:"ألمانيا",flag:"🇩🇪",cat:"europe",num:"+491512345678",link:"https://receive-sms-free.cc/country/germany/"},
{country:"كندا",flag:"🇨🇦",cat:"usa wa",num:"+16135551234",link:"https://receive-sms-free.cc/country/canada/"},
{country:"السعودية",flag:"🇸🇦",cat:"arab",num:"نادر - اضغط لعرض المتوفر",link:"https://receive-sms-free.cc/regions/"},
{country:"مصر",flag:"🇪🇬",cat:"arab",num:"نادر - اضغط لعرض المتوفر",link:"https://receive-sms-free.cc/regions/"},
{country:"الإمارات",flag:"🇦🇪",cat:"arab",num:"نادر - اضغط لعرض المتوفر",link:"https://receive-sms-free.cc/regions/"},
{country:"المغرب",flag:"🇲🇦",cat:"arab",num:"نادر - اضغط لعرض المتوفر",link:"https://receive-sms-free.cc/regions/"},
{country:"العراق",flag:"🇮🇶",cat:"arab",num:"نادر - اضغط لعرض المتوفر",link:"https://receive-sms-free.cc/regions/"},
{country:"الأردن",flag:"🇯🇴",cat:"arab",num:"نادر - اضغط لعرض المتوفر",link:"https://receive-sms-free.cc/regions/"},
];
function render(f){let h="";data.forEach(d=>{if(f!=="all"&&!d.cat.includes(f))return;let wa=d.cat.includes("wa")?'<span style="background:#25D366;color:#fff;padding:3px 8px;border-radius:10px;font-size:12px">💚 يقبل واتساب</span>':'<span style="background:#dcfce7;padding:3px 8px;border-radius:10px;font-size:12px">📩 SMS فقط</span>';h+=`<div class="card"><h3>${d.flag} ${d.country}</h3>${wa}<div class="num">${d.num}</div><div class="btns"><button class="copy" onclick="copyNum('${d.num}')">📋 نسخ الرقم</button><a class="open" href="${d.link}" target="_blank">عرض الرسائل الحقيقية</a></div></div>`});document.getElementById("list").innerHTML=h;}
function show(f,b){document.querySelectorAll(".filter button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(f);}
function copyNum(n){navigator.clipboard.writeText(n);alert("تم نسخ الرقم: "+n);}
render("all");
</script>
</body>
</html>
